<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none';">
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden; user-select: none;
      -webkit-app-region: drag;
      display: flex; align-items: center; justify-content: center;
    }

    body.done { opacity: 0; transition: opacity 0.35s ease; }

    /* Anillo de carga circular — se llena según el progreso */
    .ring {
      width: 74px; height: 74px;
      border-radius: 50%;
      background: conic-gradient(#00bfff 0deg, #8a2be2 0%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.08) 100%);
      -webkit-mask: radial-gradient(transparent 62%, black 64%);
      mask: radial-gradient(transparent 62%, black 64%);
      filter: drop-shadow(0 0 10px rgba(0, 191, 255, 0.45));
      animation: ring-spin 1.2s linear infinite;
      -webkit-app-region: no-drag;
    }

    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      display: none;
      position: absolute; bottom: 16px; left: 0; right: 0;
      text-align: center;
      font-family: Consolas, monospace; font-size: 9px;
      letter-spacing: 1px; color: #ff453a;
    }
  </style>
</head>
<body>
  <div class="ring" id="ring"></div>
  <div class="status-text" id="status-text"></div>
  <script src="js/splash.js"></script>
</body>
</html>
